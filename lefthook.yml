pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{rs}"
      run: bash scripts/format_staged.sh
      stage_fixed: true
    web-check:
      glob:
        - "web/*.{ts,tsx,js,jsx,json,css}"
        - "web/**/*.{ts,tsx,js,jsx,json,css}"
      run: cd web && bun run check

commit-msg:
  commands:
    commitlint:
      run: bun run commitlint -- --edit {1}

post-checkout:
  commands:
    worktree-bootstrap:
      run: bash scripts/run-lefthook-hook.sh post-checkout {1} {2} {3}
      fail_text: "linked worktree bootstrap was skipped or reported a warning; use just worktree-bootstrap for strict repair"
