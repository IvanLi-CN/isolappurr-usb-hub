name: Notify release failure

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions: {}

jobs:
  notify-workflow-run:
    name: notify failed release run
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    permissions:
      id-token: write
    with:
      outcome: failure
      summary: >-
        project: IsolaPurr USB Hub;
        title: Release workflow failure;
        status: completed;
        result: ${{ github.event.workflow_run.conclusion }};
        target_sha: ${{ github.event.workflow_run.head_sha }};
        run_url: ${{ github.event.workflow_run.html_url }};
        workflow: ${{ github.event.workflow_run.name }};
        ref: branch: ${{ github.event.workflow_run.head_branch }};
        run_attempt: ${{ github.event.workflow_run.run_attempt }};
        actor: ${{ github.event.workflow_run.actor.login }};
        event: ${{ github.event.workflow_run.event }};
        details: automated release workflow failure

  smoke-test:
    name: smoke test notification
    if: github.event_name == 'workflow_dispatch'
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    permissions:
      id-token: write
    with:
      outcome: failure
      summary: >-
        project: IsolaPurr USB Hub;
        title: Release notification smoke;
        status: workflow_dispatch;
        result: failure;
        target_sha: ${{ github.sha }};
        run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }};
        workflow: Release;
        ref: branch: ${{ github.ref_name }};
        run_attempt: ${{ github.run_attempt }};
        actor: ${{ github.actor }};
        event: workflow_dispatch;
        details: manual smoke test
