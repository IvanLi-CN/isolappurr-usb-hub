name: Repo Contracts

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Repo Contracts / Python contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Truth-source coverage note
        run: |
          cat <<'EOF'
          Repo contract coverage includes:
          - AGENTS.md
          - README.md
          - web/README.md
          - docs/maintainer-workflow.md
          - .github/workflows/firmware.yml
          - .github/workflows/release.yml
          - docs/specs/kvbq9-web-demo-surface-policy/**
          - docs/specs/r7m2q-cli-devd-alignment/**
          - skills/isolapurr-user-operations/**
          - skills/isolapurr-developer-operations/**
          - skills/isolapurr-maintainer-workflow/**
          - tools/isolapurr-host/src/bin/isolapurr/**
          - web/src/App.tsx
          - web/src/pages/**
          EOF

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contract tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p "test_*.py"

  worktree-bootstrap:
    name: Repo Contracts / Worktree bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verified Lefthook
        env:
          LEFTHOOK_VERSION: 2.1.14
          LEFTHOOK_SHA256: 3a00d7c023a701a72ee071a91d4c9f347a862fcd68295d8d8dffd02f92d81ddf
        run: |
          asset="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          url="https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${asset}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/lefthook"
          printf '%s  %s\n' "$LEFTHOOK_SHA256" "$RUNNER_TEMP/lefthook" | sha256sum --check
          chmod +x "$RUNNER_TEMP/lefthook"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run linked-worktree smoke
        run: bash scripts/test-worktree-bootstrap.sh
